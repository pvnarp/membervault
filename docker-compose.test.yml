# E2E test environment — use with: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=membership
      - POSTGRES_USER=membership_user
      - POSTGRES_PASSWORD=testpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membership_user -d membership"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    # Seed runs via the /cron/seed-demo endpoint after startup (called by E2E setup)
    # Migrations run automatically in index.ts on boot
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://membership_user:testpassword@postgres:5432/membership
      - JWT_SECRET=test-jwt-secret-must-be-at-least-32-characters-long-for-safety
      - JWT_REFRESH_SECRET=test-jwt-refresh-secret-must-be-32-characters-long-too
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - CORS_ORIGIN=http://localhost
      - EMAIL_FROM=noreply@test.org
      - UPLOAD_PATH=/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "80:80"
    environment:
      - DOMAIN=localhost
    depends_on:
      backend:
        condition: service_healthy
