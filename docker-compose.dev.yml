services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=membership
      - POSTGRES_USER=membership_user
      - POSTGRES_PASSWORD=devpassword
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membership_user -d membership"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://membership_user:devpassword@postgres:5432/membership
      - JWT_SECRET=dev-jwt-secret-must-be-at-least-32-characters-long-for-safety
      - JWT_REFRESH_SECRET=dev-jwt-refresh-secret-must-be-32-characters-long-too
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - CORS_ORIGIN=http://localhost
      - EMAIL_FROM=noreply@example.org
      - UPLOAD_PATH=/app/uploads
    volumes:
      - document-uploads-dev:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=localhost
    volumes:
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    depends_on:
      - backend

volumes:
  postgres-dev-data:
  document-uploads-dev:
  caddy_dev_data:
  caddy_dev_config:
